[package]
name = "repo"
version = "0.1.2"
edition = "2021"
description = "Polyrepo manager — manage multiple git repositories in a workspace"

[[bin]]
name = "repo"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "src/setup.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
colored = "2"
walkdir = "2"
anyhow = "1"
rayon = "1"
console = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
